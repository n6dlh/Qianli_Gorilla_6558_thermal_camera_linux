name: Build AppImage

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build AppImage
        run: VERSION="${GITHUB_REF_NAME}" ./scripts/build-appimage.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermalCam-AppImage
          path: dist/*.AppImage

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          generate_release_notes: true
